repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: ["--line-length", "80"]
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args:
          [
            "--max-complexity",
            "22",
            "--max-line-length",
            "80",
            "--show-source",
            "--verbose",
            "--extend-ignore",
            "E203",
          ]
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args:
          [
            "--profile",
            "black",
            "--multi-line",
            "3",
            "--trailing-comma",
            "--line-length",
            "80",
          ]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.3.0
    hooks:
      - id: mypy
        args:
          [
            "--show-column-numbers",
            "--disallow-untyped-defs",
            "--follow-imports",
            "skip",
            "--ignore-missing-imports",
            "--no-implicit-optional",
            "--warn-no-return",
            "--warn-unused-ignores",
            "--pretty",
          ]
