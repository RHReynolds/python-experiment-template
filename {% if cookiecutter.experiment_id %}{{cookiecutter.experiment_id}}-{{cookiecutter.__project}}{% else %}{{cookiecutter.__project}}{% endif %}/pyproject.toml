[project]
name = "{{cookiecutter.__repo_name}}"
version = "0.1.0"
description = "{{cookiecutter.description}}"
authors = [{name = "{{cookiecutter.owner}}"}]
requires-python = ">={{cookiecutter.python_version}}"

dependencies = [
    "polars>=0.20.0",
    "session-info>=1.0.0",
    "typed-argument-parser==1.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=24.4.0",      # For code formatting
    "flake8>=7.1.0",      # For linting
    "isort>=5.13.0",      # For import sorting 
    "mypy>=1.3.0",        # For type checking
    "pre-commit>=3.0.0",  # For hook management
]